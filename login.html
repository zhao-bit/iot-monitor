<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>登录 - 物联网智能监控系统</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- HUD背景画布 -->
    <canvas id="hudCanvas"></canvas>
    
    <!-- HUD叠加层 -->
    <div class="hud-overlay">
        <div class="hud-counters">
            <div class="hud-item">FRAME: <span id="hudFrame">00000</span></div>
            <div class="hud-item">BITRATE: <span id="hudBitrate">0.0 MB/s</span></div>
            <div class="hud-item">ENGINE: <span id="hudEngine">VISION-AI v3.8.2</span></div>
        </div>
        <div class="hud-rec">
            <span class="rec-dot"></span>
            <span>REC</span>
        </div>
        <div class="hud-threat">
            <span>THREAT LEVEL</span>
            <div class="threat-bar">
                <span class="threat-fill" id="threatFill"></span>
            </div>
        </div>
    </div>
    
    <!-- 左右十六进制数据流 -->
    <div class="hex-stream hex-stream-left" id="hexStreamLeft"></div>
    <div class="hex-stream hex-stream-right" id="hexStreamRight"></div>
    
    <!-- 底部右侧波形分析仪 -->
    <div class="waveform-panel">
        <div class="panel-title">SIGNAL ANALYZER</div>
        <canvas id="waveformCanvas"></canvas>
        <div class="panel-meta">
            <span>System Online</span>
            <span>Encrypted Connection</span>
        </div>
    </div>
    
    <!-- 聚焦遮罩 -->
    <div class="login-focus-backdrop"></div>
    
    <!-- 登录容器 -->
    <div class="login-container">
        <div class="login-box" id="loginBox">
            <div class="orbit-ring ring-outer"></div>
            <div class="orbit-ring ring-inner"></div>
            <!-- Logo和标题 -->
            <div class="login-header">
                <div class="logo-icon">
                    <i class="fas fa-brain"></i>
                </div>
                <h1>智能监控系统</h1>
                <p>INTELLIGENT MONITORING SYSTEM</p>
            </div>
            
            <!-- 登录表单 -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            placeholder="用户名" 
                            autocomplete="username"
                            required
                        >
                    </div>
                    <span class="error-message" id="usernameError"></span>
                </div>
                
                <div class="form-group">
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="密码" 
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message" id="passwordError"></span>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>记住我</span>
                    </label>
                    <a href="#" class="forgot-password">忘记密码？</a>
                </div>
                
                <div class="login-status">
                    <span class="status-label">STATUS</span>
                    <span class="status-text" id="loginStatusText">STANDBY</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span class="btn-text">ACCESS</span>
                    <span class="btn-loader" style="display: none;">
                        <i class="fas fa-spinner fa-spin"></i>
                    </span>
                </button>
            </form>
            
            <!-- 底部信息 -->
            <div class="login-footer">
                <p>&copy; 2026 物联网智能监控系统. 保留所有权利.</p>
            </div>
        </div>
    </div>
    
    <script src="js/login.js"></script>
</body>
</html>
